<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <input type="email" id="username" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Contraseña" required><br><br>
        <button type="submit">Entrar</button>
    </form>
    <p id="message"></p>
    <a href="/user/register">Ir a Registro</a>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            const response = await fetch('/user/auth/jwt/login', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                document.getElementById('message').innerText = "Login exitoso! Redirigiendo...";
                setTimeout(() => {
                    window.location.href = "/user/dashboard";
                }, 1000);
            } else {
                document.getElementById('message').innerText = "Error en credenciales";
            }
        });
    </script>
</body>
</html>
